version: '3'

tasks:
  default:
    desc: 利用可能なタスク一覧を表示
    cmds:
      - task --list
    silent: true

  dev:
    desc: Astroの開発サーバーを起動
    cmds:
      - npm run dev

  build:
    desc: 本番用サイトをビルド
    cmds:
      - npm run build

  preview:
    desc: 本番用サイトをビルドしてローカルで確認
    deps:
      - build
    cmds:
      - npm run preview

  deploy:
    desc: ビルドしてCloudflare Workersへデプロイ
    cmds:
      - npx wrangler whoami
      - npm run deploy

  deploy:dry-run:
    desc: 公開せずにCloudflareへのデプロイ内容を検証
    cmds:
      - npm run deploy:dry-run
